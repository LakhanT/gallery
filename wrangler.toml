name = "gallery"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# Set ADMIN_PASSWORD with:
#   npx wrangler pages secret put ADMIN_PASSWORD --project-name gallery
# Face service (Python InsightFace buffalo_l) — required for search + reindex:
#   npx wrangler pages secret put FACE_SERVICE_URL --project-name gallery
#   npx wrangler pages secret put FACE_SERVICE_API_KEY --project-name gallery
# Optional: FACE_SERVICE_TIMEOUT_MS (default 60000)
# Do not commit plaintext secrets. Never put FACE_SERVICE_API_KEY in frontend code.
#
# Durable face jobs:
#   Pages PRODUCES to FACE_SEARCH_QUEUE / FACE_INDEX_QUEUE (this file).
#   A separate Worker CONSUMES — see wrangler.face-consumer.toml
#   Create queues once (do not duplicate):
#     npx wrangler queues create gallery-face-search
#     npx wrangler queues create gallery-face-search-dlq
#     npx wrangler queues create gallery-face-index
#     npx wrangler queues create gallery-face-index-dlq
#
# Local Vite: no queue bindings → in-memory dispatcher (see lib/face-search-job.js).

[[d1_databases]]
binding = "DB"
database_name = "gallery-db"
database_id = "4391e57e-29e8-4250-b57c-776f3b2ce15a"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "gallery-photos"

# Pages can produce to Queues; consumers must be a Worker (wrangler.face-consumer.toml).
[[queues.producers]]
binding = "FACE_SEARCH_QUEUE"
queue = "gallery-face-search"

[[queues.producers]]
binding = "FACE_INDEX_QUEUE"
queue = "gallery-face-index"
