<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="drop-veil" id="drop-veil" hidden>
      <p>Drop photos here</p>
    </div>

    <header class="top">
      <div class="brand">
        <h1>Gallery</h1>
        <p id="count">Shared gallery — everyone with this site sees the same photos.</p>
      </div>
      <div class="actions">
        <button class="btn" type="button" id="find-btn">Find a face</button>
        <button class="btn btn-solid" type="button" id="upload-btn">Add photos</button>
      </div>
      <input
        id="file-input"
        type="file"
        accept="image/*"
        multiple
        hidden
      />
      <input
        id="face-input"
        type="file"
        accept="image/*"
        hidden
      />
    </header>

    <main>
      <p class="scan" id="scan-status" hidden></p>
      <div class="search-bar" id="search-bar" hidden>
        <p id="search-label"></p>
        <button class="btn" type="button" id="search-clear">Show all dumps</button>
      </div>
      <section class="empty" id="empty">
        <h2>No photos yet</h2>
        <p>Upload a photo and everyone who opens this site will see it. Starter photos are already in the gallery.</p>
        <button class="btn btn-solid" type="button" id="empty-upload">Choose photos</button>
      </section>

      <section class="grid" id="grid" hidden></section>
    </main>

    <dialog class="viewer" id="viewer">
      <form method="dialog" class="viewer-bar">
        <button class="btn" value="close" type="submit">Close</button>
        <div class="viewer-actions">
          <button class="btn btn-solid" type="button" id="viewer-download">Download</button>
          <button class="btn btn-danger" type="button" id="viewer-delete">Remove</button>
        </div>
      </form>
      <button class="nav prev" type="button" id="prev" aria-label="Previous photo">‹</button>
      <img id="viewer-image" alt="" />
      <button class="nav next" type="button" id="next" aria-label="Next photo">›</button>
      <p class="caption" id="viewer-caption"></p>
    </dialog>

    <dialog class="picker" id="face-picker">
      <form method="dialog" class="picker-bar">
        <button class="btn" value="cancel">Cancel</button>
      </form>
      <h2>Which face?</h2>
      <p>That photo has more than one person. Choose who to find in the dumps.</p>
      <div class="face-choices" id="face-choices"></div>
    </dialog>

    <div class="toast" id="toast" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
