# Render Blueprint — Abbsolute Legends Gallery face service (event-scale)
# Docs: docs/FACE_SERVICE_RENDER.md + docs/SCALE_3000.md
#
# Horizontal scale: raise instance count in Render dashboard after benchmarking.
# Do NOT wire Cloudflare production secrets until staging load tests pass.

services:
  - type: web
    name: gallery-face-service
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./face-service/Dockerfile
    dockerContext: ./face-service
    healthCheckPath: /livez
    envVars:
      - key: FACE_PROVIDERS
        value: CPUExecutionProvider
      - key: FACE_MATCH_SIMILARITY
        value: "0.42"
      - key: FACE_UNCERTAIN_SIMILARITY
        value: "0.32"
      - key: FACE_MIN_DETECTION_SCORE
        value: "0.50"
      - key: FACE_MIN_QUALITY_SCORE
        value: "0.25"
      - key: MAX_SEARCH_CONCURRENCY
        value: "2"
      - key: MAX_INDEX_CONCURRENCY
        value: "1"
      - key: MAX_QUEUE_SIZE
        value: "64"
      - key: MAX_IMAGE_BYTES
        value: "8388608"
      - key: MAX_IMAGE_PIXELS
        value: "12000000"
      - key: MAX_LONG_EDGE
        value: "1600"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "45"
      - key: SEARCH_CACHE_TTL
        value: "60"
      - key: INDEX_PAUSE_WHEN_SEARCH_QUEUE_GT
        value: "16"
      - key: FACE_SERVICE_API_KEY
        sync: false
